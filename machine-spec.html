<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesifikasi Mesin</title>
    <style>
        :root { --bg-page: #f0f2f5; --bg-card: #ffffff; --primary: #007bff; --radius: 12px; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-page); margin: 0; padding: 20px 0; }
        .main-container { max-width: 500px; margin: 0 auto; padding: 0 15px; }
        .section-card { background: var(--bg-card); padding: 20px; border-radius: var(--radius); margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .spec-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eeeeee80; }
        .video-item { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        .video-header { background: #f8f9fa; padding: 12px; cursor: pointer; display: flex; justify-content: space-between; }
        .video-content { display: none; }
        .video-item.active .video-content { display: block; }
        .video-content iframe { width: 100%; aspect-ratio: 16/9; border: none; }
        #loading-overlay-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; }
    </style>
</head>
<body>

<div id="loading-overlay-screen">
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
    <p id="loading-text" style="margin-top: 15px; font-family: sans-serif;">Memuat data mesin...</p>
</div>

<div id="content" class="main-container" style="display: none;">
    <div class="section-card" style="padding: 0; overflow: hidden;">
        <div class="img-container">
            <img id="mesin-img" src="" alt="Foto Mesin" style="border-radius: var(--radius) var(--radius) 0 0; width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #f8f9fa;">
        </div>
    </div>

    <div class="section-card" style="margin-top: 15px;">
        <h2 id="mesin-name" style="margin: 0 0 5px 0; font-size: 1.5rem;">-</h2>
        <p id="mesin-sn" style="color: #666; margin: 0; font-family: monospace; font-size: 0.95rem;"></p>
    </div>

    <div class="section-card">
        <div id="specs-base-container">
            <div class="spec-item"><span>Model</span><span id="spec-model">-</span></div>
            <div class="spec-item"><span>Factory Date</span><span id="spec-date">-</span></div>
            <div class="spec-item"><span>Customer</span><span id="cust-name" style="font-weight: bold; color: var(--primary);">-</span></div>
        </div>
    </div>

    <div class="section-card">
        <h3>Spesifikasi Teknis</h3>
        <div id="specs-tech-container">
            <div class="spec-item"><span>Packed Product</span><span id="spec-product">-</span></div>
            <div class="spec-item"><span>Bag Type</span><span id="spec-bag">-</span></div>
            <div class="spec-item"><span>Packed Weight</span><span id="spec-weight">-</span></div>
            <div class="spec-item"><span>Voltage</span><span id="spec-voltage">-</span></div>
            <div class="spec-item"><span>Electrical Type</span><span id="spec-elec">-</span></div>
            <div class="spec-item"><span>Speed</span><span id="spec-speed">-</span></div>
            <div class="spec-item"><span>Power</span><span id="spec-power">-</span></div>
        </div>
    </div>

    <div class="section-card">
        <h3>Spareparts Utama</h3>
        <ul id="sparepart-list" style="padding-left: 20px;"></ul>
    </div>

    <div class="section-card">
        <h3>Video Tutorial</h3>
        <div id="video-list"></div>
    </div>
</div>

<style> @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } </style>

<script>
    // GANTI DENGAN URL APPS SCRIPT-MU
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTxktuhuSsqzxyGCHmyRUVLwRHpPs9uWDb1ILi9xDckT1vLs8t5WltLa_GrANWrCos/exec"; 

    window.onload = async () => {
        const urlParams = new URLSearchParams(window.location.search);
        
        // TROUBLESHOOT UTAMA: Ambil 'id' ATAU 'sn' (buat jaga-jaga)
        const sn = urlParams.get('id') || urlParams.get('sn');
        
        const loader = document.getElementById('loading-overlay-screen');
        const loadText = document.getElementById('loading-text');

        if (!sn) {
            loadText.innerHTML = "<b style='color:red'>Error: ID Mesin tidak ditemukan di URL.</b><br><small>Pastikan URL mengandung ?id=...</small>";
            return;
        }

        try {
            const response = await fetch(`${SCRIPT_URL}?sn=${encodeURIComponent(sn)}`);
            const data = await response.json();

            if (!data || data.error) {
                loadText.innerText = "Data mesin tidak ditemukan di database.";
                return;
            }

            // Render Data ke HTML
            document.getElementById('mesin-img').src = data.FotoMesin || "";
            document.getElementById('mesin-name').innerText = data.NamaMesin || "-";
            document.getElementById('mesin-sn').innerText = data.SerialNumber || "-";
            document.getElementById('cust-name').innerText = data.NamaCustomer || "";

            document.getElementById('spec-model').innerText = data.Model || "-";
            document.getElementById('spec-date').innerText = data.FactoryDate ? new Date(data.FactoryDate).toLocaleDateString('id-ID') : "-";
            document.getElementById('spec-product').innerText = data.PackedProduct || "-";
            document.getElementById('spec-bag').innerText = data.BagType || "-";
            document.getElementById('spec-weight').innerText = data.PackedWeight || "-";
            document.getElementById('spec-voltage').innerText = data.Voltage || "-";
            document.getElementById('spec-elec').innerText = data.ElectricalType || "-";
            document.getElementById('spec-speed').innerText = data.Speed || "-";
            document.getElementById('spec-power').innerText = data.Power || "-";

            // Spareparts
            const spList = document.getElementById('sparepart-list');
            if (data.SparepartsJSON) {
                const sps = JSON.parse(data.SparepartsJSON);
                spList.innerHTML = sps.map(item => `<li><strong>${item.cat}:</strong> ${item.pn}</li>`).join('');
            }

            // Videos
            const vidList = document.getElementById('video-list');
            if (data.VideosJSON) {
                const vids = JSON.parse(data.VideosJSON);
                vidList.innerHTML = vids.map((url, i) => {
                    const vId = extractYoutubeId(url);
                    if (!vId) return '';
                    return `
                        <div class="video-item ${i === 0 ? 'active' : ''}">
                            <div class="video-header" onclick="this.parentElement.classList.toggle('active')">
                                <span>Video Tutorial ${i+1}</span><span>▼</span>
                            </div>
                            <div class="video-content">
                                <iframe src="https://www.youtube.com/embed/${vId}" allowfullscreen></iframe>
                            </div>
                        </div>`;
                }).join('');
            }

            // Tampilkan Konten
            loader.style.display = 'none';
            document.getElementById('content').style.display = 'block';

        } catch (e) {
            console.error(e);
            loadText.innerText = "Gagal memuat data. Periksa koneksi atau URL Apps Script.";
        }
    };

    function extractYoutubeId(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length == 11) ? match[2] : null;
    }
</script>
</body>
</html>
